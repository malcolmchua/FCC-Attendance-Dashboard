<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCC Attendance</title>
<style>
  :root { --coral: #E8613F; --ink: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3; --bg: #faf9f7; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: var(--ink); }
  header { background: var(--coral); color: #fff; padding: 18px 24px; }
  header .mark { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; opacity: .9; }
  header h1 { font-size: 22px; font-weight: 600; margin: 4px 0 0; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 60px; }
  .gate { max-width: 360px; margin: 80px auto; text-align: center; }
  .gate input { width: 100%; font-size: 17px; padding: 13px; border: 1px solid var(--line);
                border-radius: 10px; margin-top: 14px; }
  .gate button { width: 100%; font-size: 17px; font-weight: 600; padding: 14px; margin-top: 12px;
                 border: 0; border-radius: 10px; background: var(--coral); color: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .tile .n { font-size: 34px; font-weight: 600; line-height: 1.1; }
  .tile .l { font-size: 13px; color: var(--muted); margin-top: 4px; }
  section { margin-top: 30px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase;
       letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 26px; font-size: 13px; color: var(--muted); }
  .err { color: #a32d2d; font-size: 14px; margin-top: 12px; }
  .empty { color: var(--muted); font-size: 14px; padding: 14px; background: #fff;
           border: 1px solid var(--line); border-radius: 12px; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1 style="font-size:20px;font-weight:600">FCC Attendance</h1>
  <p style="color:#6b6b6b;font-size:15px">Enter the team password.</p>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="go">Open</button>
  <div class="err" id="gateErr"></div>
</div>

<div id="app" hidden>
  <header>
    <div class="mark">New Bahru</div>
    <h1>FCC Attendance</h1>
  </header>
  <main>
    <div class="tiles">
      <div class="tile"><div class="n" id="tOnSite">–</div><div class="l">on site now</div></div>
      <div class="tile"><div class="n" id="tPeople">–</div><div class="l">people today</div></div>
      <div class="tile"><div class="n" id="tVisits">–</div><div class="l">visits today</div></div>
      <div class="tile"><div class="n" id="tMissing">–</div><div class="l">missing clock-out</div></div>
    </div>

    <section>
      <h2>On site now</h2>
      <div id="onSite"></div>
    </section>

    <section>
      <h2>This month, by company</h2>
      <div id="companies"></div>
    </section>

    <section>
      <h2>Needs a look</h2>
      <div id="attention"></div>
    </section>

    <div class="foot" id="foot"></div>
  </main>
</div>

<script>
var KEY = 'fcc-dash-pw';

function el(id) { return document.getElementById(id); }

function time(ms) {
  return new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function dateTime(ms) {
  return new Date(ms).toLocaleString('en-GB',
    { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function table(headers, rows) {
  if (!rows.length) return '<div class="empty">Nothing to show.</div>';
  var head = headers.map(function (h) {
    return '<th' + (h.num ? ' class="num"' : '') + '>' + h.label + '</th>';
  }).join('');
  var body = rows.map(function (r) {
    return '<tr>' + r.map(function (cell, i) {
      var td = document.createElement('td');
      td.textContent = cell === null || cell === undefined ? '' : String(cell);
      if (headers[i].num) td.className = 'num';
      return td.outerHTML;
    }).join('') + '</tr>';
  }).join('');
  return '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
}

function render(d) {
  el('tOnSite').textContent = d.onSite.length;
  el('tPeople').textContent = d.today.people;
  el('tVisits').textContent = d.today.visits;
  el('tMissing').textContent = d.today.missingClockOut;

  el('onSite').innerHTML = table(
    [{ label: 'Name' }, { label: 'Company' }, { label: 'Since', num: true }],
    d.onSite.map(function (p) { return [p.name, p.company, time(p.inAt)]; })
  );

  el('companies').innerHTML = table(
    [{ label: 'Company' }, { label: 'People', num: true },
     { label: 'Visits', num: true }, { label: 'Hours', num: true }],
    d.companies.map(function (c) { return [c.company, c.people, c.visits, c.hours]; })
  );

  el('attention').innerHTML = table(
    [{ label: 'Name' }, { label: 'Company' }, { label: 'When' }, { label: 'Why' }],
    d.needsAttention.map(function (r) {
      return [r.name, r.company, dateTime(r.inAt), r.why];
    })
  );

  el('foot').textContent = 'Month ' + d.month + ' · read at ' + dateTime(d.asOf) +
    ' · photographs stay in Drive and are not shown here.';
}

function load(password) {
  return fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: password })
  }).then(function (r) {
    return r.json().then(function (body) {
      if (!r.ok) throw new Error(body.error || 'Could not load.');
      return body;
    });
  });
}

function open(password) {
  return load(password).then(function (data) {
    try { sessionStorage.setItem(KEY, password); } catch (e) {}
    el('gate').hidden = true;
    el('app').hidden = false;
    render(data);
    setInterval(function () { load(password).then(render).catch(function () {}); }, 60000);
  });
}

el('go').addEventListener('click', function () {
  var pw = el('pw').value;
  if (!pw) { el('gateErr').textContent = 'Enter the password first.'; return; }
  el('gateErr').textContent = '';
  open(pw).catch(function (e) { el('gateErr').textContent = e.message; });
});

el('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('go').click(); });
el('pw').addEventListener('input', function () { el('gateErr').textContent = ''; });

try {
  var saved = sessionStorage.getItem(KEY);
  if (saved) open(saved).catch(function () {});
} catch (e) {}
</script>
</body>
</html>
